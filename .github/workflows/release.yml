name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            label: apple-silicon
          - goarch: amd64
            label: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w" -o dronagiri .
          mkdir -p dist
          tar -czf "dist/dronagiri_${VERSION}_darwin_${{ matrix.goarch }}.tar.gz" dronagiri
          shasum -a 256 "dist/dronagiri_${VERSION}_darwin_${{ matrix.goarch }}.tar.gz" \
            > "dist/dronagiri_${VERSION}_darwin_${{ matrix.goarch }}.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
